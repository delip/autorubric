[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autorubric"
dynamic = ["version"]
description = "A Python library encapsulating best practices for rubric-based evaluation of LLM/VLM outputs using LLM-as-a-judge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Delip Rao", email = "" }
]
keywords = ["rubrics", "grading", "eval", "llm", "evaluation", "autorubric", "llm judge", "llm as a judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "litellm>=1.50.0",
    "tenacity>=8.2.0",
    "diskcache>=5.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "coolname>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.6",
    "krippendorff>=0.8.2",
]

[project.optional-dependencies]
# Decision-model judges (TypeSafe's Jev and other System One-compatible endpoints).
# 0.7.1 is the first SDK release that redacts credentials from transport errors.
# httpx2 is the SDK's HTTP stack (part of its public API); base URLs are parsed with it.
# h11 writes its HTTP/1.1 requests; extra headers are checked with it.
typesafe = ["typesafe-sdk>=0.7.1", "httpx2>=2.0.0", "h11>=0.16"]

[dependency-groups]
dev = [
    # The test suite exercises the decision-model client against the real SDK types.
    "autorubric[typesafe]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff==0.14.1",
    "ty>=0.0.9",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "pymdown-extensions>=10.0",
    # Under Click 8.3.x, `mkdocs serve` (MkDocs 1.6.1) starts without live reload: its
    # --livereload/--no-livereload flag pair loses its default (mkdocs/mkdocs#4032).
    # Click 8.4.0 restored the earlier default resolution (pallets/click#3403).
    "click!=8.3.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates and demo/runner scripts embed natural-language prompt,
# skill, and report text (and column-aligned f-string tables) where the
# 100-char line limit would force semantically-meaningful line breaks.
"src/autorubric/prompts.py" = ["E501"]
"scripts/*" = ["E501"]
"examples/*" = ["E501"]
"researcher_bench/*" = ["E501"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.sdist]
exclude = [
    "researcher_bench/",
    "examples/",
    "experiments/",
    "tests/",
    "docs/",
    "dist/",
    ".github/",
    ".claude/",
    "scripts/",
    "mkdocs.yml",
    "pytest.ini",
    "uv.lock",
    ".env*",
    "*.pdf",
    "*_notes.md",
    "*_best_practices*.md",
    "*_report.md",
    "laj_vs_llm_rubrics.md",
    "llm_config.example.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autorubric"]

[project.urls]
Homepage = "https://github.com/delip/autorubric"
Repository = "https://github.com/delip/autorubric"
Issues = "https://github.com/delip/autorubric/issues"

