<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social card: AutoRubric 1.7.0</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: #0d1117;
        color: #e6edf3;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        position: relative;
    }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    /* Sized to stay legible when a platform shrinks the card to a ~250px thumbnail. */
    .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 20px; }
    .wordmark { font-size: 40px; font-weight: 700; }
    .version {
        font-size: 30px; font-weight: 700; color: #0d1117; background: #f0b429;
        padding: 6px 16px; border-radius: 8px;
    }
    h1 {
        position: absolute; left: 64px; top: 204px; width: 800px;
        font-size: 104px; line-height: 1.06; font-weight: 700; letter-spacing: -2px;
    }
    h1 span { display: block; color: #f0b429; }

    .motif { position: absolute; left: 868px; top: 178px; width: 268px; height: 330px; }
    .sheet {
        position: absolute; left: 0; top: 0; width: 268px; height: 268px;
        background: #ffffff; border-radius: 24px; display: block;
    }
    .badge {
        position: absolute; right: -20px; bottom: 0; width: 132px; height: 132px;
        border-radius: 50%; background: #f0b429; border: 10px solid #0d1117;
        display: flex; align-items: center; justify-content: center;
    }
</style>
</head>
<body>
    <div class="brand"><span class="wordmark">AutoRubric</span><span class="version mono">v1.7.0</span></div>
    <h1>Grade images <span>against a rubric</span></h1>

    <div class="motif" aria-hidden="true">
        <svg class="sheet" viewBox="0 0 268 268" xmlns="http://www.w3.org/2000/svg">
            <polyline points="44,36 44,224 232,224" fill="none" stroke="#1f2328" stroke-width="8"
                stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="64,196 100,140 140,104 180,84 224,76" fill="none" stroke="#2b6cb0"
                stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="badge">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#0d1117" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
    </div>
</body>
</html>
