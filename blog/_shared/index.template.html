<!DOCTYPE html>
<html lang="{{ language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <meta name="robots" content="{{ robots }}">
    <link rel="canonical" href="{{ canonical }}">
{{ rel_links }}
    <link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="/blog/feed.xml">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AutoRubric">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">

    <script type="application/ld+json">
{{ jsonld }}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/blog/assets/base.css">
</head>

<body>
    <a href="#main" class="skip-link">Skip to content</a>
    {{ header }}

    <main id="main">
        <section class="page-head">
            <div class="container">
                <h1>{{ heading }}</h1>
                <p class="tagline">{{ tagline }}</p>
            </div>
        </section>

        <section class="posts" aria-label="Posts">
            <div class="container">
{{ entries }}
{{ pagination }}
            </div>
        </section>
    </main>

    {{ footer }}
</body>

</html>
