    <script>

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.renderMathInElement) return;
            renderMathInElement(document.querySelector('article'), {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\[', right: '\\]', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false }
