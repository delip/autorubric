# LLM Configuration Examples for AutoRubric
# Copy and customize for your use case
#
# temperature: omit it (the default) to use the provider's default, which
# reasoning models such as GPT-5.x require; set it (e.g. 0.0) to pin a value.

# ============================================================================
# OpenAI Configuration
# ============================================================================
# model: openai/gpt-5.2
# max_tokens: 1024
# cache_enabled: true
# cache_ttl: 3600  # 1 hour
# seed: 42  # For reproducibility

# ============================================================================
# Anthropic Claude Configuration
# ============================================================================
# model: anthropic/claude-sonnet-4-5-20250929
# temperature: 0.0
# max_tokens: 4096
# prompt_caching: true  # Enable prompt caching for cost savings

# ============================================================================
# Thinking/Reasoning (works across providers)
# ============================================================================
# model: anthropic/claude-sonnet-4-5-20250929
# thinking: high  # "low", "medium", "high", or token budget (e.g., 32000)
# max_tokens: 16000
# prompt_caching: true

# model: openai/responses/gpt-5-mini
# thinking: medium  # Uses reasoning_effort parameter

# model: gemini/gemini-2.5-pro
# thinking: 20000  # Explicit token budget

# ============================================================================
# Google Gemini Configuration
# ============================================================================
# model: gemini/gemini-2.5-flash
# temperature: 0.0
# max_tokens: 2048

# ============================================================================
# Local Ollama Configuration
# ============================================================================
# model: ollama/qwen3:14b
# temperature: 0.0
# cache_enabled: true
# cache_dir: .dev_cache

# ============================================================================
# Azure OpenAI Configuration
# ============================================================================
# model: azure/your-deployment-name
# temperature: 0.0
# api_base: https://your-resource.openai.azure.com/

# ============================================================================
# Development Configuration (with caching)
# ============================================================================
model: openai/gpt-5.2-mini
cache_enabled: true
cache_dir: .autorubric_cache
cache_ttl: 3600
max_retries: 3
timeout: 60.0
