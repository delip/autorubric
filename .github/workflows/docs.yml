name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocstrings[python] pyyaml

      - name: Build documentation
        run: |
          # Build mkdocs to site/docs/ subdirectory
          mkdocs build --site-dir site/docs

          # Copy landing page to root
          cp docs/landing/index.html site/

          # Copy standalone Research page to /research/
          mkdir -p site/research
          cp docs/research/index.html site/research/index.html

          # Check the blog's posts, then assemble /blog/ and the root
          # sitemap.xml, robots.txt and llms.txt. Draft posts are left out.
          python scripts/blog.py check
          python scripts/blog.py build --out site

          # Copy CNAME to root for custom domain
          cp docs/CNAME site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
